{% extends "Subnautica/index.html" %}
{% load static %}
{% block css_styling %}
    <link rel="stylesheet" href="{% static "css/main.css" %}" />
    <link rel="stylesheet" href="{% static "css/search_results.css" %}" />
{% endblock %}

{% block main_wrapper %}
    <main>
        <div class="list_main_wrapper">
            <section class="item_list">
                {% if biomes %}
                    <div class="search_results">
                        {% for biome in biomes %}
                            <div class="item">
                                <div class="item_pic">
                                    <img src="{% static biome.get_img_path %}" alt="{{ biome.biome }}" />
                                </div>
                                <div class="item_info">
                                    <a href="{% url 'subnautica:biome_view' biome_name=biome.get_biome_url %}" class="item_name">{{ biome.biome }}</a>
                                    <p class="item_type">{{ biome.biome_type }}</p>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <p>No results found for "{{ query }}".</p>
                {% endif %}
            </section>
        </div>
    </main>
{% endblock %}
